<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 232" width="580" height="232" role="img" aria-label="AI HR Resume Screening: Pulls skills from PDF resumes, scores candidates ATS-style, then emails the decision automatically. Admin dashboard tracks applicants live.">
<defs>
  <linearGradient id="bd-card-hr" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="580" y2="232">
    <stop offset="0" stop-color="#A371F7"/><stop offset=".45" stop-color="#A371F7" stop-opacity=".12"/><stop offset=".55" stop-color="#A371F7" stop-opacity=".12"/><stop offset="1" stop-color="#F778BA"/>
    <animateTransform attributeName="gradientTransform" type="rotate" from="0 290.0 116.0" to="360 290.0 116.0" dur="7s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="sh-card-hr" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <radialGradient id="gl-card-hr" cx=".12" cy=".05" r=".7"><stop offset="0" stop-color="#A371F7" stop-opacity=".22"/><stop offset="1" stop-color="#A371F7" stop-opacity="0"/></radialGradient>
  <clipPath id="cp-card-hr"><rect x="2" y="2" width="576" height="228" rx="20"/></clipPath>
</defs>
<rect x="2" y="2" width="576" height="228" rx="20" fill="#0c1326"/>
<rect x="2" y="2" width="576" height="228" rx="20" fill="url(#gl-card-hr)"/>
<g clip-path="url(#cp-card-hr)"><rect y="0" width="160" height="232" fill="url(#sh-card-hr)" transform="skewX(-18)"><animate attributeName="x" values="-260;700" dur="5.5s" repeatCount="indefinite" keyTimes="0;1"/></rect></g>
<rect x="2" y="2" width="576" height="228" rx="20" fill="none" stroke="url(#bd-card-hr)" stroke-width="2"/>
<g transform="translate(28,24)">
  <rect width="52" height="52" rx="14" fill="#A371F7" fill-opacity=".12" stroke="#A371F7" stroke-opacity=".45"/>
  <g transform="translate(26,26)"><path d="M-9-13 H3 L9-7 V13 H-9Z" fill="none" stroke="#A371F7" stroke-width="2.2" stroke-linejoin="round"/><path d="M-4-1H4M-4 4H4M-4 9H1" stroke="#A371F7" stroke-width="2" stroke-linecap="round"/><animateTransform attributeName="transform" additive="sum" type="scale" values="1;1.1;1" dur="3s" repeatCount="indefinite"/></g>
</g>
<text x="96" y="46" font-family="'Segoe UI','Helvetica Neue',Ubuntu,Arial,sans-serif" font-size="23" font-weight="800" fill="#fff">AI HR Resume Screening</text>
<text x="96" y="68" font-family="'Segoe UI','Helvetica Neue',Ubuntu,Arial,sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.8" fill="#A371F7">RECRUITING  ·  LLM  ·  DEPLOYED</text>
<text x="28" y="110" font-family="'Segoe UI','Helvetica Neue',Ubuntu,Arial,sans-serif" font-size="14.5" fill="#b4c0dc">Pulls skills from PDF resumes, scores candidates</text><text x="28" y="133" font-family="'Segoe UI','Helvetica Neue',Ubuntu,Arial,sans-serif" font-size="14.5" fill="#b4c0dc">ATS-style, then emails the decision automatically.</text><text x="28" y="156" font-family="'Segoe UI','Helvetica Neue',Ubuntu,Arial,sans-serif" font-size="14.5" fill="#b4c0dc">Admin dashboard tracks applicants live.</text>
<g transform="translate(28,184)"><rect width="83" height="26" rx="13" fill="#A371F7" fill-opacity=".10" stroke="#A371F7" stroke-opacity=".4"/><text x="42" y="17.5" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Ubuntu,Arial,sans-serif" font-size="12" font-weight="600" fill="#dbe6ff">Groq LLM</text></g><g transform="translate(119,184)"><rect width="83" height="26" rx="13" fill="#A371F7" fill-opacity=".10" stroke="#A371F7" stroke-opacity=".4"/><text x="42" y="17.5" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Ubuntu,Arial,sans-serif" font-size="12" font-weight="600" fill="#dbe6ff">Supabase</text></g><g transform="translate(210,184)"><rect width="91" height="26" rx="13" fill="#A371F7" fill-opacity=".10" stroke="#A371F7" stroke-opacity=".4"/><text x="45" y="17.5" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Ubuntu,Arial,sans-serif" font-size="12" font-weight="600" fill="#dbe6ff">Gmail API</text></g><g transform="translate(309,184)"><rect width="68" height="26" rx="13" fill="#A371F7" fill-opacity=".10" stroke="#A371F7" stroke-opacity=".4"/><text x="34" y="17.5" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Ubuntu,Arial,sans-serif" font-size="12" font-weight="600" fill="#dbe6ff">Render</text></g>
<g transform="translate(536,34)" opacity=".85"><path d="M0 12 L12 0 M4 0 H12 V8" fill="none" stroke="#A371F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><animateTransform attributeName="transform" type="translate" values="0 0;3 -3;0 0" dur="2.4s" repeatCount="indefinite"/></path></g>
