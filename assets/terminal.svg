<text x="34" y="92" font-family="'SFMono-Regular',Consolas,'Liberation Mono','Courier New',monospace" font-size="15" fill="#8b9bbd" xml:space="preserve" opacity="0">hassan@karachi:~$ whoami<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0375;0.0495;0.94;1" dur="16s" repeatCount="indefinite"/></text><text x="34" y="114" font-family="'SFMono-Regular',Consolas,'Liberation Mono','Courier New',monospace" font-size="15" fill="#e6edf3" xml:space="preserve" opacity="0">Muhammad Hassan Shahzad  |  AI &amp; Automation Engineer<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0906;0.1026;0.94;1" dur="16s" repeatCount="indefinite"/></text><text x="34" y="158" font-family="'SFMono-Regular',Consolas,'Liberation Mono','Courier New',monospace" font-size="15" fill="#8b9bbd" xml:space="preserve" opacity="0">hassan@karachi:~$ cat profile.json<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1969;0.2089;0.94;1" dur="16s" repeatCount="indefinite"/></text><text x="34" y="180" font-family="'SFMono-Regular',Consolas,'Liberation Mono','Courier New',monospace" font-size="15" fill="#e6edf3" xml:space="preserve" opacity="0">{<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2500;0.2620;0.94;1" dur="16s" repeatCount="indefinite"/></text><text x="34" y="202" font-family="'SFMono-Regular',Consolas,'Liberation Mono','Courier New',monospace" font-size="15" fill="#58A6FF" xml:space="preserve" opacity="0">  "focus":      ["LLMs", "RAG", "AI Agents"],<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3031;0.3151;0.94;1" dur="16s" repeatCount="indefinite"/></text><text x="34" y="224" font-family="'SFMono-Regular',Consolas,'Liberation Mono','Courier New',monospace" font-size="15" fill="#A371F7" xml:space="preserve" opacity="0">  "automation": ["n8n", "Flask", "REST APIs"],<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3562;0.3682;0.94;1" dur="16s" repeatCount="indefinite"/></text><text x="34" y="246" font-family="'SFMono-Regular',Consolas,'Liberation Mono','Courier New',monospace" font-size="15" fill="#F778BA" xml:space="preserve" opacity="0">  "memory":     ["Pinecone", "Supabase", "PostgreSQL"],<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4094;0.4214;0.94;1" dur="16s" repeatCount="indefinite"/></text><text x="34" y="268" font-family="'SFMono-Regular',Consolas,'Liberation Mono','Courier New',monospace" font-size="15" fill="#E3B341" xml:space="preserve" opacity="0">  "studying":   "BSCS, Iqra University, CGPA 3.75",<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4625;0.4745;0.94;1" dur="16s" repeatCount="indefinite"/></text><text x="34" y="290" font-family="'SFMono-Regular',Consolas,'Liberation Mono','Courier New',monospace" font-size="15" fill="#3FB950" xml:space="preserve" opacity="0">  "openToWork": true<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5156;0.5276;0.94;1" dur="16s" repeatCount="indefinite"/></text><text x="34" y="312" font-family="'SFMono-Regular',Consolas,'Liberation Mono','Courier New',monospace" font-size="15" fill="#e6edf3" xml:space="preserve" opacity="0">}<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5687;0.5807;0.94;1" dur="16s" repeatCount="indefinite"/></text><text x="34" y="334" font-family="'SFMono-Regular',Consolas,'Liberation Mono','Courier New',monospace" font-size="15" fill="#8b9bbd" xml:space="preserve" opacity="0">hassan@karachi:~$ <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6219;0.6339;0.94;1" dur="16s" repeatCount="indefinite"/></text>
